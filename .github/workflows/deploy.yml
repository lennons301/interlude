name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialise deploys: each push to main triggers its own run, and two concurrent
# `docker compose down → build → up` sequences on the 2 vCPU / 4 GB VPS starve
# the box (incident 2026-08-01, issue #40 — prod and even sshd stopped
# answering). Queue rather than cancel: killing a mid-flight deploy could
# strand the stack half-torn-down between `down` and `up`.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          # The SHA this run is deploying, so the box can prove it actually got
          # it (issue #189).
          envs: DEPLOY_SHA
          script: |
            # `set -euo pipefail` is load-bearing (issue #189). Without `-e`, a
            # failed `git pull` was not fatal: every later step ran against the
            # old checkout, `compose build app` was a 100% cache hit that
            # reproduced the *identical* image, `up -d` recreated the containers
            # and the health check passed against the old app — so two commits
            # "deployed successfully" while prod sat 4.5h behind.
            set -euo pipefail

            cd /opt/interlude

            # The pull is anonymous (public repo, HTTPS remote, no credential on
            # the box) and GitHub rate-limits unauthenticated requests from an IP
            # that also serves every agent container's plugin clone. That is a
            # transient, recurring failure, so retry it before giving up —
            # and then fail, loudly, rather than deploying nothing.
            for attempt in 1 2 3; do
              if git pull origin main; then break; fi
              echo "git pull failed (attempt $attempt/3) — retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
              [ "$attempt" -lt 3 ] || { echo "ERROR: could not pull origin/main after 3 attempts"; exit 1; }
            done

            # The assertion that makes this whole class of failure loud: a stale
            # checkout, a partial pull and a cached rebuild of old source all
            # fail here, and a green run means prod is running the pushed commit.
            HEAD_SHA=$(git rev-parse HEAD)
            if [ "$HEAD_SHA" != "$DEPLOY_SHA" ]; then
              echo "ERROR: checkout is at $HEAD_SHA but this run deploys $DEPLOY_SHA — refusing to report success for code that is not there"
              exit 1
            fi
            echo "Deploying $DEPLOY_SHA"

            # Stop app before rebuild to free RAM for the Next.js build (4GB VPS)
            docker compose down
            docker image prune -f
            # Force a rebuild of the agent images at the first pass after the
            # deploy: every image the builder stamps (the shared base and one per
            # harness adapter, issue #216) is selected by its stamp label rather
            # than by name, so a new adapter's image is covered without an edit
            # here and the pre-#216 single image is cleaned up by the same line.
            # Unused images only, as before: an image a parked agent container
            # still references is left for it. A Dockerfile change would rebuild
            # by itself (the stamp covers both files); this also picks up the
            # unpinned installs — the harness CLI, gh, pnpm — on each deploy.
            docker image prune -a -f --filter label=co.interlude.agent-dockerfile-sha256 2>/dev/null || true
            docker compose build app

            # The agent network is `external` in compose (issue #190), so `down`
            # no longer destroys it and `up` will not create it. Idempotent, so a
            # fresh box works and an existing network keeps its ID — which is the
            # whole point: a parked agent container references it by ID and could
            # never start again after a recreate.
            docker network create interlude 2>/dev/null || true

            # Render the proxy's env from Doppler (interlude/prd) — the same config
            # the app boots with, making it the single source of truth for DOMAIN.
            # Caddy is a stock image that can't run under `doppler run`, so it gets
            # a generated env file instead of a hand-maintained copy in .env
            # (issue #25 — see the caddy comment in docker-compose.yml).
            DOMAIN=$(docker compose run --rm --no-deps -T app doppler secrets get DOMAIN --plain --project interlude --config prd || true)
            if [ -z "$DOMAIN" ]; then
              echo "ERROR: could not read DOMAIN from Doppler (interlude/prd) — refusing to deploy the proxy blind"
              exit 1
            fi
            printf '# GENERATED by deploy — do not edit. DOMAIN comes from Doppler (interlude/prd),\n# the same config the app reads, so the proxy and the app cannot diverge.\nDOMAIN=%s\n' "$DOMAIN" > caddy.env
            if grep -q '^DOMAIN=' .env 2>/dev/null; then
              echo "NOTE: DOMAIN in .env is no longer read by any service (Caddy uses the generated caddy.env); the entry and its comment can be removed."
            fi

            docker compose up -d

            # Regression check: the proxy must be running with the same DOMAIN the
            # app boots with, or Caddy silently falls back to serving localhost
            CADDY_DOMAIN=$(docker compose exec -T caddy sh -c 'echo "$DOMAIN"' || true)
            if [ "$CADDY_DOMAIN" != "$DOMAIN" ]; then
              echo "ERROR: caddy's DOMAIN ('$CADDY_DOMAIN') does not match Doppler's ('$DOMAIN') — is the container running?"
              docker compose ps
              docker compose logs --tail 30 caddy
              exit 1
            fi

            # Health check — exercise what a browser exercises: TLS on the real
            # domain with real SNI and certificate verification, through this
            # box's front door (--resolve pins to localhost so DNS is not in the
            # loop). http://localhost:80 passed for 24h while every real
            # hostname failed with a TLS error.
            echo "Waiting for https://$DOMAIN/ to answer over verified TLS..."
            for i in $(seq 1 24); do
              if curl -sf --max-time 10 --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/" -o /dev/null; then
                echo "App is healthy: https://$DOMAIN/ answered over verified TLS"
                exit 0
              fi
              sleep 5
            done
            echo "ERROR: HTTPS health check failed after 120s"
            curl -v --max-time 10 --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/" -o /dev/null 2>&1 | tail -n 40 || true
            docker compose logs --tail 50
            exit 1
