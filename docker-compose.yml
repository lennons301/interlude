services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Memory caps: the host has no headroom to spare (4GB, and one agent
    # container is entitled to 2GB of it). Uncapped, a leak here competes with
    # the kernel itself — on 2026-09-03 dockerd's leak plus a stuck run tipped
    # the box into a global OOM and a 3-hour reclaim livelock (kernel answering
    # SYN, no userspace process able to emit a byte). A per-service cap turns
    # that into a single contained restart. dockerd/containerd are capped
    # separately via systemd drop-ins; the agent cap is AGENT_MEMORY_MB.
    mem_limit: 192m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # DOMAIN reaches Caddy via caddy.env, generated by the deploy from Doppler
    # (interlude/prd) — the same config the app boots with. Never hand-set
    # DOMAIN in .env: Caddy doesn't run under `doppler run`, and a second,
    # hand-maintained copy is the split-brain that served localhost for 24h
    # (issue #25). `required: false` keeps local `docker compose up` working
    # (Caddyfile falls back to localhost) and lets `docker compose down` parse
    # the model on a fresh box before the first render.
    env_file:
      - path: ./caddy.env
        required: false
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - app_data:/data
    environment:
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=/data/interlude.db

volumes:
  caddy_data:
  caddy_config:
  app_data:

networks:
  # `external` is load-bearing, not tidiness (issue #190). This is the compose
  # *default* network, renamed — so `docker compose down` used to remove it and
  # `up -d` recreate it with a **new ID**, while every parked agent container
  # (stopped but preserved since #93, re-adopted at boot since #136) still
  # referenced the old one. Their `docker start` then failed
  # `404 … network <old-id> not found` forever, so a blocked run could survive a
  # restart and never a deploy — and deploys land on every push to main.
  #
  # The network genuinely outlives the stack: agent containers attach to it and
  # are not compose services, so compose is the wrong thing to own its
  # lifecycle. Declaring it external means `up` requires it to exist, which the
  # deploy guarantees with an idempotent `docker network create` (and local dev
  # has always created it by hand — see CLAUDE.md).
  default:
    name: interlude
    external: true
