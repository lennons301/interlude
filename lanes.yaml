# Execution lanes (issue #172).
#
# A lane is how a pass actually gets run: which harness adapter, authenticated
# with which environment variables, against which endpoint, with which model
# identifier standing behind each tier, under which caps, on which billing
# posture. Making that a named bundle is what turns "swap the subscription for
# a metered API" from a code change into a configuration change.
#
# Two rules this file exists to keep honest:
#
#   1. **Secrets appear only as environment-variable NAMES, never values.** The
#      `auth` mapping reads `HARNESS_VARIABLE: ORCHESTRATOR_VARIABLE` — the
#      variable the harness reads on the left, the orchestrator variable
#      holding the secret on the right. The resolver reads the named variable
#      at execution time and hands the value to that one exec, never to the
#      persistent container environment and never to the database. The parser
#      enforces the shape (`^[A-Z][A-Z0-9_]*$`), so an inlined secret is a
#      parse error rather than a leak.
#   2. **Shape lives here; tuning lives in the UI.** Which lanes exist, which
#      adapter, which endpoint, which variables and which model identifiers are
#      a reviewable architectural fact, so they are version-controlled. Which
#      lane is primary is an operator decision, so it is settable on the
#      settings screen (and falls through to `AGENT_LANE`, then to the
#      preference order below).
#
# Because several providers expose Anthropic-compatible endpoints, the Claude
# lanes here all run the SAME adapter — Claude Code — and differ only in base
# URL, auth variable and model identifiers. The two Codex lanes at the foot of
# the file (issue #221) run the second adapter, `codex`, and are how a ChatGPT
# plan and an OpenAI API key become lanes at all: which harness runs a pass is
# a fact about its lane, exactly as the provider is (spec #213).
#
# A lane move carries the conversation only between lanes on the same adapter
# (issues #176, #199, #217): a pass refused on one Claude lane — or parked on
# its window and resumed early on another — continues the same Claude Code
# session, because the session transcript is a Claude Code artefact and both
# ends run Claude Code; a Codex thread likewise continues between the two Codex
# lanes. A lane declaring a DIFFERENT `adapter` is still a legal move target,
# but a move onto it cannot carry the session: the pass starts again on the
# branch with the work already pushed, and its feed says so (enforced at
# `restoreSessionTranscript` — see the limit at the foot of
# `src/lib/harness/adapter.ts`). It costs the conversation, not the attempt.

# The default primary, in preference order: the first lane whose named
# variables are all present wins. This reproduces exactly what the platform did
# before lanes existed — prefer the subscription token, fall back to an API key
# — and it is deliberately a short list of Anthropic-direct lanes, so a
# deployment can never *default* onto a lane that spends real money at a
# third party. An operator's explicit choice (settings screen, or AGENT_LANE)
# outranks this list and is honoured even when that lane is unavailable, so a
# missing credential is reported rather than routed around.
#
# Since issue #176 this list is a *preference*, not the routing: with no
# explicit choice made, each pass runs on the **cheapest lane that can serve
# it**, and this order only breaks a tie on cost. Three things follow, and all
# three are visible on the settings screen:
#
#   - While the subscription window is open nothing changes. A subscription
#     lane costs nothing at the margin — its quota is already bought — so it
#     wins every comparison, which is what made cost routing safe as a default.
#   - A lane that bills per token and declares no `prices` below has an
#     *unread* cost, and is ranked last accordingly: under-reading cost is how
#     a fleet spends money nobody authorised. So an overflow off a walled
#     window now prefers a lane whose price is written down over the
#     Anthropic-direct one, even though the two charge the same.
#   - `AGENT_MIN_LANE` (and the per-pass-kind rows on the settings screen) is a
#     capability *floor*, expressed as a lane: routing may pick anything at or
#     above the lane you name. Naming `anthropic-api` therefore means
#     "first-party Claude only" for that pass kind, while leaving it unset lets
#     triage and review run on the cheapest thing declared here.
#
# An explicit choice **pins** the fleet and turns cost routing off entirely: no
# pass is moved for cheapness while the pinned lane can serve the work. A
# **walled** pinned lane still fails over rather than waiting the window out —
# the pin is honoured right up to the point where the lane cannot serve the
# request at all, which is a different thing from one you would rather not use.
#
# A minimum lane never excludes the lane in force either, for the same reason
# in reverse: it bounds where routing may *send* a pass, so a floor the
# deployment's only lane cannot meet does not stop work.
primary:
  - claude-subscription
  - anthropic-api

lanes:
  # The id is unchanged by the plan the account is on: it is on every ledger
  # row this lane has ever run (`runs.lane` / `tasks.lane`) and in the stored
  # primary-lane override, so only the label names the plan (issue #211).
  - id: claude-subscription
    label: Claude subscription (Pro)
    adapter: claude-code
    billing: subscription
    # A long-lived token from `claude setup-token`, exec-scoped into the
    # container — the VPS-verified live path (#48), unchanged by lanes.
    auth:
      CLAUDE_CODE_OAUTH_TOKEN: CLAUDE_CODE_OAUTH_TOKEN
    # No base_url: Anthropic's own endpoint, which is the only one a
    # subscription OAuth token authenticates against.
    models:
      # The CLI's own short aliases, which is what every pass has run on since
      # issue #74 — so "all existing passes run through this lane unchanged"
      # is a fact about these three lines.
      #
      # Plan fact (issue #211): the account is on Claude Pro, and Pro includes
      # Opus, so `heavy` is Opus. Fable 5.1 on Pro is NOT included in the
      # plan's limits — it bills to usage credits at API rates — so it is not
      # named here. The upgrade path, on a Max plan: set `heavy: fable`; add
      # `fable` to MODEL_TIER_ALIASES (src/lib/model-tiers.ts) as an alias of
      # `heavy`, so a Fable-scoped rate-limit window (`seven_day_fable`) steps
      # the tier ladder down (#170) instead of reading as account-wide; and
      # keep usage credits DISABLED on the account, so the 50%-of-weekly Fable
      # allowance surfaces as a wall the fleet can see rather than as silent
      # real-money spend through a lane declared `billing: subscription`.
      heavy: opus
      standard: sonnet
      light: haiku

  - id: anthropic-api
    label: Anthropic API
    adapter: claude-code
    billing: metered
    auth:
      ANTHROPIC_API_KEY: ANTHROPIC_API_KEY
    models:
      heavy: opus
      standard: sonnet
      light: haiku
    # No `prices`: this lane talks to Anthropic's own endpoint, where the CLI
    # prices a model it recognises at that model's list rates and says so
    # (`costBasis: "list"` on the result event's modelUsage). Its figure is the
    # one the fleet has always charged against, and re-declaring those prices
    # here would only create a second copy to fall out of date.
    #
    # Omitting them is legal here only because Claude Code reports cost (issue
    # #219): a metered lane on a harness whose descriptor declares no
    # `reportsCost` is refused at parse without prices for every tier, since
    # the fleet would otherwise book its spend from a figure the harness never
    # produced. A subscription lane on such a harness may still omit them.
    caps:
      # Real money, and enforced (issue #174). This is a *ceiling on the
      # ceiling*: the operator's own real-money cap (METERED_DAILY_CAP_USD, or
      # the settings screen) is bound down by whatever is declared here, the
      # lower of the two always winning. Both guards hold **new autonomous
      # pickup** — a claim or a triage pass — so the fleet never starts
      # unattended work on this lane until the day's spend has been confirmed
      # once, and stops claiming when the cap is spent. Since issue #173 they
      # also hold an *interactive* session's crossing onto a paid lane: it is
      # attended, so the same once-a-day confirmation is asked for in the
      # session itself, and at the cap the session is told it is capped rather
      # than spending past it. In-flight runs and a run's follow-up turns are
      # never held; their spend still counts against the cap. Applies whether
      # this lane is primary, the target a walled subscription window overflows
      # onto (#173) or reached by failover (#176).
      daily_budget_usd: 20

  - id: openrouter
    label: OpenRouter
    adapter: claude-code
    billing: metered
    # Claude Code sends ANTHROPIC_AUTH_TOKEN as `Authorization: Bearer`, which
    # is what OpenRouter expects; ANTHROPIC_API_KEY (an x-api-key header) is
    # deliberately not set for this lane. The credential is provisioned in
    # Doppler as OPENROUTER_API_KEY — the name on the right is the one the
    # orchestrator reads, so the two sides differing here is the whole reason
    # auth is a mapping rather than a list.
    auth:
      ANTHROPIC_AUTH_TOKEN: OPENROUTER_API_KEY
    # Not /api/v1: Claude Code appends its own /v1/messages, so the OpenAI-shaped
    # base URL would resolve to /api/v1/v1/messages.
    base_url: https://openrouter.ai/api
    models:
      # OpenRouter slugs, not CLI aliases. Anthropic models by default, because
      # a lane's job is to change who bills for the work, not to change what
      # the work is run by — retune these here without touching code.
      heavy: anthropic/claude-opus-4.1
      standard: anthropic/claude-sonnet-4.5
      light: anthropic/claude-haiku-4.5
    # USD per million tokens, from OpenRouter's own model listing on
    # 2026-09-02. Declared because the CLI's reported cost is NOT usable off an
    # Anthropic-direct endpoint (issue #175): measured, it priced a turn on a
    # free model at $0.194985, having applied Anthropic list rates to a model
    # it had never heard of. These figures happen to match Anthropic's list
    # prices, which is the point — the lane is only worth having if what it
    # charges is written down rather than guessed at by the harness.
    prices:
      heavy: { input: 15.0, output: 75.0, cache_read: 1.5, cache_write: 18.75 }
      standard: { input: 3.0, output: 15.0, cache_read: 0.3, cache_write: 3.75 }
      light: { input: 1.0, output: 5.0, cache_read: 0.1, cache_write: 1.25 }
    caps:
      # Enforced as above (issue #174) — the lower of this and the operator's
      # own real-money cap binds.
      daily_budget_usd: 20

  # The same credential and the same endpoint as the lane above, pointed at
  # open-weights models (issue #175). Two lanes rather than one retuned one, on
  # purpose: this file's whole claim is that changing provider is configuration
  # and changing *model* is a tier-map edit, and the cheapest way to show that
  # is a second lane whose only differences from its neighbour are three model
  # slugs and three rows of prices. Nothing else — no new credential, no new
  # adapter, no code.
  #
  # What was verified, and on what (2026-09-02, issue #175). The *endpoint* was
  # exercised with the real Claude Code harness: tool use, extended thinking,
  # `--resume` and prompt caching all passed through, and the pass did the work
  # it was asked to do. That run used a free model
  # (`minimax/minimax-m2.7:free`), because the OpenRouter account holds no
  # credits and every paid model answers 402 — so the three slugs below are
  # verified only as far as OpenRouter's model listing, which is where their
  # prices come from. Re-check them with
  # `node scripts/openrouter-lane-check.mjs --model z-ai/glm-5.3-flash` once
  # the account is funded, and read the findings on issue #175 for what did not
  # carry over: the harness's own cost figure, and quota telemetry.
  - id: openrouter-glm
    label: OpenRouter (GLM open weights)
    adapter: claude-code
    billing: metered
    auth:
      ANTHROPIC_AUTH_TOKEN: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api
    models:
      # GLM 5.3 is the current open-weights coder family; Flash is the cheap
      # variant, roughly two orders of magnitude under the top Claude tier.
      # `standard` is Flash rather than full 5.3 deliberately: this lane exists
      # to be cheap, and a lane's default tier is where its cost actually lands.
      heavy: z-ai/glm-5.3
      standard: z-ai/glm-5.3-flash
      light: z-ai/glm-4.7-flash
    # USD per million tokens, from OpenRouter's model listing on 2026-09-02.
    # `cache_write` is deliberately absent across the family: OpenRouter
    # publishes no cache-write price for these models, and the cost calculation
    # reads an absent cache price as the input rate rather than as free.
    prices:
      heavy: { input: 1.4, output: 4.4, cache_read: 0.26 }
      standard: { input: 0.075, output: 0.25, cache_read: 0.015 }
      light: { input: 0.06, output: 0.4, cache_read: 0.01 }
    caps:
      # Enforced as above (issue #174, #173) — the lower of this and the
      # operator's own real-money cap binds.
      daily_budget_usd: 20

  # ---------------------------------------------------------------------------
  # Codex CLI lanes (issue #221). Both run the `codex` adapter
  # (src/lib/harness/codex/), whose descriptor declares what these lanes can
  # and cannot do: the exec stream carries NO quota telemetry (the quota tile
  # says "cannot report" for both, permanently) and NO dollar figure (so the
  # metered lane below MUST declare prices — the parser refuses it otherwise);
  # a thread resumes by id from one rollout file, so a pause and a same-adapter
  # move carry the conversation; and user-invoked skills are OFF until the proof
  # ticket (#224) shows `$skill` mentions honoured under `codex exec`, so no
  # generation session is routed here yet.
  #
  # Neither lane is in `primary`: a deployment never *defaults* onto them. They
  # become routing candidates (a failover target off a walled Claude window, or
  # the cheapest lane for a pass) the moment their credential is provisioned —
  # which is why the credentials are provisioned only when #224 has run.
  #
  # Model identifiers: the GPT-5.6 family as the CLI (0.153.4) and OpenAI's
  # pricing page name it on 2026-09-05 — three sizes that map onto the three
  # tiers. The same three on both lanes, so a move between them changes who
  # bills and not what runs the work; retune here without touching code, and
  # expect #224 to confirm which identifiers the ChatGPT plan actually serves.
  - id: codex-subscription
    label: Codex (ChatGPT plan)
    adapter: codex
    billing: subscription
    # The documented CI credential is a seeded `~/.codex/auth.json` (the file
    # `codex login` writes). The orchestrator variable holds that file's
    # contents; the adapter's turn script writes them into a Codex home created
    # for the one exec and removes it when the turn ends, so the file never
    # persists in a container. Known risk for #224 to settle: the CLI refreshes
    # a ChatGPT token and rewrites auth.json in place, and the fleet deletes
    # that file with the exec home and re-seeds the original each turn, so a
    # rotated refresh token may stop working after the first refresh. The CLI
    # (0.153.4) also reads a ChatGPT-backed personal access token from
    # `CODEX_ACCESS_TOKEN`; should #224 prefer that path, this mapping becomes
    # `CODEX_ACCESS_TOKEN: CODEX_ACCESS_TOKEN` — a plain pass-through, no code
    # change.
    auth:
      CODEX_AUTH_JSON: CODEX_AUTH_JSON
    # No base_url: the CLI's built-in OpenAI provider, the only one a ChatGPT
    # credential authenticates against.
    models:
      heavy: gpt-5.6-sol
      standard: gpt-5.6-terra
      light: gpt-5.6-luna

  - id: openai-api
    label: OpenAI API
    adapter: codex
    billing: metered
    # The variable the CLI reads an API key from is CODEX_API_KEY (measured on
    # 0.149.1 and 0.153.4: OPENAI_API_KEY alone sends no bearer). The secret is
    # provisioned under its natural name on the right.
    auth:
      CODEX_API_KEY: OPENAI_API_KEY
    models:
      heavy: gpt-5.6-sol
      standard: gpt-5.6-terra
      light: gpt-5.6-luna
    # USD per million tokens, from OpenAI's API pricing page on 2026-09-05
    # (input / cached input / output, plus the page's short-context cache write
    # price). Required, not optional: Codex reports no cost, so these are the
    # only figures the fleet has to book this lane's spend from (issue #219's
    # rule, enforced at parse).
    prices:
      heavy: { input: 4.0, output: 20.0, cache_read: 0.4, cache_write: 5.0 }
      standard: { input: 2.0, output: 12.0, cache_read: 0.2, cache_write: 2.5 }
      light: { input: 0.2, output: 1.2, cache_read: 0.02, cache_write: 0.25 }
    caps:
      # Enforced as above (issue #174) — the lower of this and the operator's
      # own real-money cap binds.
      daily_budget_usd: 20
